- id: banking-source-of-funds
  topic: 示例国别 / 银行
  type: decision_framework
  title: 资金来源说明的证据链
  content: |
    银行关注的不只是付款人名称，而是资金如何从经营或投资活动形成并流入新公司。
    证据链应从原始收入、分红或融资文件，一直连接到汇款账户和最终用途。
  dimensions:
    - 资金来自经营收入、股东注资还是集团借款
    - 原始资金形成文件是否可核验
    - 汇款路径是否经过无关第三方
    - 金额与新公司的预算用途是否匹配
  redlines:
    - 不应使用无法说明关系的个人或第三方账户代为注资
  keywords: [资金来源, 注资, 汇款路径, 股东借款, source of funds, banking]
