- id: tax-vat-threshold-monitoring
  topic: 示例国别 / 税务
  type: checklist
  title: 流转税登记门槛监控
  content: |
    企业不能等年度审计时才检查流转税登记义务。应按月汇总应税收入、跨境服务和关联交易，
    同时记录接近门槛的日期，以便在触发后的申请窗口内完成登记。
  redlines:
    - 达到强制登记门槛后继续按未登记主体开票会累积处罚风险
  keywords: [流转税, 增值税, 门槛, 营业额, 登记, vat, threshold]
