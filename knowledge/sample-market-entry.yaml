- id: entity-freezone-vs-mainland
  topic: 示例国别 / 主体设立
  type: decision_framework
  title: 自贸区主体与关境内主体的选择维度
  content: |
    这是设立环节的第一个分叉，选错之后改的成本很高。
    自贸区主体通常在外资持股、利润汇出和设立速度上更宽松，适合区域总部、
    贸易中转和面向境外客户的业务。关境内主体在承接本地政府与国企合同、
    开展本地零售和获取部分行业牌照上不可替代。
    多数企业最终是两者并存：自贸区持股，关境内经营。
  dimensions:
    - 业务是否需要直接面向本地终端客户收款
    - 是否需要承接本地政府或国企合同
    - 对外资持股比例是否有硬性要求
    - 利润汇出频率与外汇管制的容忍度
    - 是否需要为本地雇员办理工作签证
  redlines:
    - 自贸区主体通常不得直接在关境内开展经营活动，需通过本地分销商或另设主体
    - 以自贸区主体签署关境内政府合同，在多数情形下会被认定为无效
  keywords: [自贸区, 关境内, 主体, 设立, 持股, 分公司, freezone, mainland, entity]
  source:
    title: 合成示例数据（非真实政策）
