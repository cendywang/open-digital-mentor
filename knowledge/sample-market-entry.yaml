- id: labor-employment-contract
  topic: 示例国别 / 用工
  type: checklist
  title: 本地劳动合同必备条款
  content: |
    劳动合同应明确岗位、工作地点、工资构成、工时、试用期、休假、保密和终止条件。
    总部模板中的竞业限制、知识产权和奖金条款需要按当地可执行性调整。
  redlines:
    - 合同工资不得低于签证或工资保护系统中申报的金额
    - 不得用内部手册单方面降低法定最低权益
  keywords: [劳动合同, 工资, 试用期, 休假, 竞业, employment contract]
