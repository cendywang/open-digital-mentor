    is_sample_data: true

- id: banking-account-opening-blockers
  topic: 示例国别 / 银行
  type: fact
  title: 企业银行开户的常见卡点
  content: |
    开户被拒很少是因为材料不全，更多是因为银行没有被说服"这家公司真的在本地经营"。
    审核重点通常是三件事：实际控制人背景、资金来源说明、本地经营实质。
    其中经营实质最容易被低估——没有本地办公场地租约、没有本地雇员、
    没有本地客户合同的公司，通常会被要求反复补件，或在几周后被直接拒绝。
    建议在设立阶段就同步准备租约与至少一名本地雇员，而不是等开户被拒再补。
  keywords: [银行, 开户, 账户, 实质, 尽调, 实际控制人, bank, account, kyc]
  source:
    title: 合成示例数据（非真实政策）
