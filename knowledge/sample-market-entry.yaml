- id: payments-fx-settlement
  topic: 示例国别 / 银行
  type: decision_framework
  title: 跨境收款与外汇结算路径
  content: |
    跨境收款方案需要同时考虑合同主体、发票币种、银行可接受的贸易背景和资金回流需求。
    只比较汇率通常会忽略合规审核、到账稳定性和对账成本。
  dimensions:
    - 客户付款币种与公司成本币种是否匹配
    - 银行需要哪些合同、发票或物流文件
    - 是否存在定期向总部汇回利润的需求
    - 支付服务商是否支持企业所在地与业务类型
  redlines:
    - 不得把持续经营收入伪装成股东往来规避贸易背景审核
  keywords: [跨境收款, 外汇, 结算, 币种, 汇回, fx, payment]
