    is_sample_data: true

- id: entity-tax-registration-window
  topic: 示例国别 / 税务
  type: checklist
  title: 主体设立后的税务登记时限清单
  content: |
    设立完成不等于可以开展业务。以下事项通常有明确的时限，逾期会产生定额罚款，
    并连带影响银行开户与资质申请。
    1. 取得营业执照后完成税务登记
    2. 完成增值税或等价流转税的登记（若营业额达到门槛）
    3. 完成社保与雇员登记（若已雇佣本地员工）
    4. 指定税务代表或本地会计（部分行业强制）
  redlines:
    - 逾期登记的罚款通常不可通过事后补登豁免
    - 未完成税务登记前开具发票，可能被认定为虚开
  keywords: [税务, 登记, 时限, 罚款, 增值税, 社保, tax, registration, vat]
  source:
    title: 合成示例数据（非真实政策）
