- id: sales-government-tender
  topic: 示例国别 / 渠道
  type: checklist
  title: 政府与国企投标准入清单
  content: |
    投标前应核对供应商注册、当地实体年限、税务证明、业绩门槛、保证金和本地化评分。
    商务团队还要确认实际签约主体与提交资质的主体一致。
  redlines:
    - 不得借用其他公司的业绩或供应商账号提交投标
    - 不得向中间人支付无法对应真实服务的成功费
  keywords: [政府投标, 国企, 供应商注册, 保证金, tender, procurement]
