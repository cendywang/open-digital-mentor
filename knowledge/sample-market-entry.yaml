- id: trade-customs-classification
  topic: 示例国别 / 贸易与海关
  type: checklist
  title: 海关归类与完税价格核对
  content: |
    报关前应根据产品材料、功能和用途确认商品编码，并保存支持归类的技术资料。
    完税价格需要解释折扣、模具费、授权费与关联交易调整，不能只照搬商业发票金额。
