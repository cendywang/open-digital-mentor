- id: tax-corporate-filing-calendar
  topic: 示例国别 / 税务
  type: checklist
  title: 企业所得税申报日历
  content: |
    税务日历至少要覆盖会计年度截止日、预缴节点、年度申报、税款支付和审计报告交付。
    每个节点都应指定资料负责人、复核人和最晚内部交付日，避免把法定截止日当成内部启动日。
  redlines:
    - 即使当期亏损或零收入，也不能默认免于提交申报
  keywords: [企业所得税, 申报, 日历, 预缴, 审计, corporate tax, filing]
