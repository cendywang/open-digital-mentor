- id: launch-first-ninety-days
  topic: 示例国别 / 落地计划
  type: decision_framework
  title: 落地前九十天任务排序
  content: |
    前九十天应围绕关键依赖排序，而不是让设立、开户、招聘和销售四条线各自推进。
    先锁定签约与收款主体，再倒排牌照、地址、银行、人员和产品准入的最晚完成点。
  dimensions:
    - 第一笔合同何时签署、由谁签署
    - 第一笔款项何时收取、进入哪个账户
    - 哪些关键员工必须到场才能推进业务
    - 产品或服务开始交付前有哪些强制许可
  redlines:
    - 不得以销售目标为由跳过产品准入、用工或税务前置条件
  keywords: [九十天, 落地计划, 任务排序, 关键路径, launch, roadmap]
