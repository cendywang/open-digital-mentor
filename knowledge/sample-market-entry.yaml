- id: security-incident-response
  topic: 示例国别 / 数据合规
  type: checklist
  title: 数据安全事件响应清单
  content: |
    发现泄露后应立即保全日志、限制继续暴露、判断受影响数据与人员，并启动通知时限评估。
    对外沟通前要统一事实版本，但不能因等待完整根因而错过强制通知窗口。
  redlines:
    - 不得删除或改写可能用于调查的原始日志
    - 不得在未评估法定义务前承诺不通知监管或客户
  keywords: [数据泄露, 安全事件, 通知, 日志, incident, breach]
