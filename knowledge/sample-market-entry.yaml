- id: labor-localization-quota
  topic: 示例国别 / 用工
  type: redline
  title: 本地化用工比例的硬性要求
  content: |
    部分行业对本地籍员工比例有强制下限，达不到会影响工作签证配额的发放，
    进而卡住整个团队的落地节奏。这个约束通常不会在设立阶段被提示，
    而是在申请第 5 到第 10 个工作签证时才突然出现。
    建议在做人员规划时，就把本地雇员比例作为一个硬约束而非优化项。
  redlines:
    - 本地化比例不达标时，新增工作签证申请通常直接被驳回，且无申诉通道
    - 以劳务外包规避比例要求，在多数情形下会被穿透认定
  keywords: [用工, 本地化, 比例, 配额, 工作签证, 劳务, labor, quota, visa]
