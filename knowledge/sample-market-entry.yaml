- id: tax-transfer-pricing-related-party
  topic: 示例国别 / 税务
  type: redline
  title: 关联交易与转让定价留痕
  content: |
    总部管理费、品牌费、集团借款和跨境采购都属于需要留痕的关联交易。
    企业应保存定价方法、可比依据、合同、交付证据与付款路径，不能只在申报前补一份说明。
  redlines:
    - 没有真实服务交付证据的管理费不得仅凭集团内部发票税前扣除
    - 关联借款利率不得脱离可解释的市场区间
  keywords: [关联交易, 转让定价, 管理费, 集团借款, transfer pricing, related party]
