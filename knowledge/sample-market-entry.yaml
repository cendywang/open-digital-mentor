- id: entity-license-activity-match
  topic: 示例国别 / 主体设立
  type: checklist
  title: 经营活动与牌照范围核对清单
  content: |
    营业执照上的活动描述决定公司能签什么合同、开什么发票和申请哪些人员资质。
    核对时应把收入来源逐项映射到许可活动，并确认线上销售、安装、售后和咨询是否需要附加许可。
  redlines:
    - 合同与发票描述长期超出许可活动范围会触发续牌或税务审查
    - 不得借用关联公司的牌照为本主体开票
  keywords: [牌照, 经营范围, 活动, 发票, 续牌, license, activity]
