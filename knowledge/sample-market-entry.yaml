- id: exit-closure-checklist
  topic: 示例国别 / 退出
  type: checklist
  title: 主体停业与注销清单
  content: |
    停止经营后仍需处理员工、客户合同、库存、税务清算、银行账户、牌照和数据留存。
    注销顺序应避免先关闭账户后无法支付税款，也要保留能接收监管通知的联系人。
  redlines:
    - 未结清员工权益、税款和债权人事项前不得分配剩余资产
    - 不得在法定保存期届满前销毁会计与交易记录
  keywords: [注销, 停业, 清算, 银行账户, 数据留存, closure, liquidation]
