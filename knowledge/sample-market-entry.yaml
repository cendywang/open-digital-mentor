- id: labor-termination-process
  topic: 示例国别 / 用工
  type: redline
  title: 员工终止与离职流程
  content: |
    终止决定需要与通知期、未休假折现、奖金规则、签证注销和公司财产归还一起处理。
    绩效原因终止还需要连续、可核验的反馈与改进记录。
  redlines:
    - 不得在受保护假期或缺少法定程序时立即解除劳动关系
    - 不得以扣留护照或工资迫使员工签署离职文件
