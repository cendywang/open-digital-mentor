- id: entity-ownership-control
  topic: 示例国别 / 主体设立
  type: decision_framework
  title: 股权比例与实际控制安排
  content: |
    名义持股比例只是控制安排的一部分。董事任免、保留事项、银行签字权和利润分配条款
    共同决定谁能控制日常经营。需要把公司章程、股东协议与银行授权放在一起审阅。
  dimensions:
    - 哪些事项需要一致同意或特别多数
    - 谁能任免总经理与财务负责人
    - 单笔付款与合同的签字权限如何分级
    - 发生僵局时是否有可执行的退出机制
  redlines:
    - 不应使用与登记文件冲突的秘密代持安排
  keywords: [股权, 控制, 董事, 签字权, 股东协议, ownership, control]
