- id: entity-branch-vs-subsidiary
  topic: 示例国别 / 主体设立
  type: decision_framework
  title: 分公司与子公司的选择维度
  content: |
    分公司通常设立更快、集团控制直接，但总公司需要对当地经营责任承担最终风险。
    子公司责任边界更清楚，也更容易引入本地股东或未来出售，但治理和申报成本更高。
    选择时应先确定风险隔离与未来融资需求，再比较设立速度。
  dimensions:
    - 是否需要把当地经营责任与集团其他资产隔离
    - 未来是否计划引入投资人或单独出售当地业务
    - 总公司能否持续提供审计文件与授权文件
    - 客户招标是否要求当地独立法人
  redlines:
    - 高责任行业不应只为节省设立成本而忽略风险隔离
  keywords: [分公司, 子公司, 法人, 风险隔离, 融资, branch, subsidiary]
  source:
    title: 合成示例数据（非真实政策）
