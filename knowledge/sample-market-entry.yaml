- id: channel-distributor-selection
  topic: 示例国别 / 渠道
  type: decision_framework
  title: 本地经销商筛选维度
  content: |
    经销商筛选不能只看承诺销量。覆盖客户、售后能力、合规记录、库存投入和数据透明度
    决定合作能否持续。试运行期应设置可核验里程碑，而不是直接给予长期独家权。
  dimensions:
    - 目标客户覆盖是否有可验证的历史交易
    - 是否具备产品注册、进口与售后能力
    - 库存、回款和市场投入由谁承担
    - 能否按期共享终端销售与客户反馈
  redlines:
    - 未完成尽调与试运行前不得授予无条件长期独家权
  keywords: [经销商, 渠道, 独家, 销量, 售后, distributor, channel]
