- id: ip-trademark-registration
  topic: 示例国别 / 知识产权
  type: checklist
  title: 品牌进入前的商标保护
  content: |
    品牌公开前应检索文字、图形和本地语言音译，并按实际商品与服务类别提交申请。
    同时登记经销商、代理商和域名注册人，避免合作方先行占有核心标识。
  redlines:
    - 不得把核心商标长期登记在经销商或个人员工名下
