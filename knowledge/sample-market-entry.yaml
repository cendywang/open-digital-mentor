- id: product-registration-path
  topic: 示例国别 / 产品准入
  type: decision_framework
  title: 产品注册与上市路径选择
  content: |
    产品上市前应先判断属于普通商品、受监管产品还是需要本地责任人的类别。
    同一产品因用途声明、销售渠道和目标客户不同，可能落入不同注册路径。
  dimensions:
    - 产品用途声明是否涉及健康、安全或专业性能
    - 是否需要检测报告、认证或当地代表
    - 注册主体应由制造商、进口商还是经销商担任
    - 包装标签和说明书是否需要本地语言
  redlines:
    - 未取得所需注册或认证前不得以试销名义公开销售
  keywords: [产品注册, 认证, 上市, 标签, 当地代表, product registration]
