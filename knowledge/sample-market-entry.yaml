- id: data-residency-assessment
  topic: 示例国别 / 数据合规
  type: decision_framework
  title: 业务数据跨境与本地存储评估
  content: |
    数据架构评估应先识别数据主体、敏感程度、处理目的和接收方，再决定是否能跨境。
    本地存储要求可能只覆盖特定行业或特定数据，并不等于所有系统都必须本地部署。
  dimensions:
    - 数据是否包含身份、健康、支付或政府相关信息
    - 数据主体与处理活动发生在哪个地区
    - 境外接收方承担什么角色与安全义务
    - 是否存在行业监管或客户合同的额外限制
  redlines:
    - 未完成合法性评估前不得把敏感数据批量复制到总部测试环境
  keywords: [数据跨境, 本地存储, 敏感数据, 隐私, data residency, privacy]
