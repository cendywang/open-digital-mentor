- id: operations-insurance-baseline
  topic: 示例国别 / 运营
  type: checklist
  title: 落地运营保险基线
  content: |
    基础保险评估应覆盖雇主责任、公众责任、财产、专业责任、网络安全和产品责任。
    保额应结合合同赔偿上限、客户要求和最坏单次事故测算，而不是沿用总部固定模板。
  redlines:
    - 合同要求的保险证明必须在服务开始前有效
