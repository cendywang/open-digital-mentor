- id: labor-visa-sequencing
  topic: 示例国别 / 用工
  type: checklist
  title: 首批员工签证办理顺序
  content: |
    首批员工落地通常依赖公司登记、办公地址、雇主账户、职位配额和体检等前置条件。
    项目计划应倒排每个依赖，并为关键员工准备远程办公或短期商务访问的合规替代方案。
  redlines:
    - 商务访问身份不得替代需要工作许可的持续受雇活动
