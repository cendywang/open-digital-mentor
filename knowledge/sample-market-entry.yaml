- id: trade-importer-of-record
  topic: 示例国别 / 贸易与海关
  type: decision_framework
  title: 进口责任主体选择
  content: |
    进口责任主体承担申报、税费、产品合规和召回配合责任。由自有公司、经销商或第三方服务商担任，
    会直接影响库存控制、客户数据和违规风险的归属。
  dimensions:
    - 谁拥有进口许可与必要产品资质
    - 谁承担税费垫付、查验与滞港成本
    - 谁控制库存、客户信息与退运决策
    - 合作终止后历史进口记录能否取得
  redlines:
    - 不应在合同未明确责任时借用陌生第三方名义进口
  keywords: [进口商, 报关, 进口责任, 经销商, importer of record, customs]
