- id: operations-office-lease
  topic: 示例国别 / 运营
  type: decision_framework
  title: 办公地址与租赁方案选择
  content: |
    虚拟地址、共享办公室和独立办公室对牌照、银行、签证配额和客户尽调的支持程度不同。
    选择地址时应把首年成本与后续补租、搬迁和变更登记成本一起比较。
  dimensions:
    - 牌照是否接受该地址类型
    - 银行和重点客户是否要求独立经营场所
    - 地址能支持多少工作签证或员工登记
    - 扩租、退租和登记变更的成本
  redlines:
    - 不得提交无法实际使用或无法配合现场核查的地址
  keywords: [办公室, 租赁, 虚拟地址, 共享办公室, 签证配额, office, lease]
