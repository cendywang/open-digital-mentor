- id: banking-account-opening-pack
  topic: 示例国别 / 银行
  type: checklist
  title: 企业开户材料包
  content: |
    开户材料包应同时解释公司是谁、为什么在当地经营、钱从哪里来以及预计如何流动。
    基础文件包括登记证照、章程、控制人身份证明、地址证明、集团结构、合同样本、资金来源和交易预测。
  redlines:
    - 控制人、业务描述和预计交易对手在不同材料中必须保持一致
